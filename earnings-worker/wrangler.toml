name = "earnings-worker"
main = "src/main.ts"
routes = ["pf.bforecast.com/*"]
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "earnings-db"
database_id = "ead78c5a-59ee-46e8-9ae7-d8e02dfbc4bf"

[triggers]
# Every 1 minute, 4-9 PM EST (21:00-01:59 UTC), Mon-Fri
# Extended window for resilience. Smart resume logic prevents redundant work.
# Processes 10 symbols per tick (approx 10-15s duration).
crons = ["*/1 21-23,0-1 * * 1-5"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1 # 100% sampling

[ai]
binding = "AI"
